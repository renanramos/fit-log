name: Deploy FitLog to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      
      - name: Install dependencies
        run: npm install

      - name: Configure git
        run: |
          git config --global user.email "renanrramossi@gmail.com"
          git config --global user.name "Renan Ramos"

      - name: Setup credentials to access private repositories
        run: git config --global url.https://${{ secrets.AUTH_PAT }}@github.com/.insteadOf https://github.com/

      - name: Build Angular Application
        run: npm run deploy
      
      - name: Add .nojekyll file
        run: touch docs/.nojekyll

      - name: Commit and Push to docs folder
        run: |
          git add docs
          git diff --staged --quiet || git commit -m "Deploy: Update GitHub Pages content"
          git push