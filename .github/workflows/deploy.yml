name: Deploy FitLog to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ssh_key: ${{ secrets.FITLOG_CI_CD }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      
      - name: Configure git
        run: |
          git config --global user.email "renanrramossi@gmail.com"
          git config --global user.name "Renan Ramos"
          git config --global url."https://x-access-token${{ secrets.GITHUB_TOKEN }}@githun.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: npm install

      - name: Build Angular Application
        run: npm run deploy
      
      - name: Add .nojekyll file
        run: touch docs/.nojekyll

      - name: Commit and Push to docs folder
        env:
          GITHUB_TOKEN : ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add docs
          git diff --staged --quiet || git commit -m "Deploy: Update GitHub Pages content"
          git push